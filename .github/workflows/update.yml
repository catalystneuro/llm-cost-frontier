name: Update frontier data

on:
  schedule:
    # Four times a day, every six hours. A successful update redeploys the
    # site (see the deploy job).
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-frontier-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data from Artificial Analysis
        run: python -m llm_cost_frontier
        env:
          PYTHONPATH: src
      - name: Render advance cards
        run: |
          pip install matplotlib
          python -m llm_cost_frontier.render
        env:
          PYTHONPATH: src
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json build/llm-frontier.json build/feed.xml build/images
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update frontier data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

  # Data commits above are made with the workflow token, which does not
  # trigger the push-driven deploy, so the deploy is called directly.
  deploy:
    needs: update
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
